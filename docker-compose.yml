services:
  docneedle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docneedle
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1024m
    ulimits:
      core: 0
    ports:
      - "7860:7860"
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - TMPDIR=/tmp
      - CUDA_CACHE_PATH=/tmp/nv-cache
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/app/hf-cache
      - XDG_CACHE_HOME=/tmp/cache
      - GRADIO_TEMP_DIR=/tmp/gradio
      - GRADIO_ANALYTICS_ENABLED=false
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_OFFLINE=1
      - PYTHONDONTWRITEBYTECODE=1
      - MODEL_STORAGE_DIR=/app/models
      - CONFIG_TOML=/app/config.toml
    volumes:
      # Model weights mounted read-only to preserve weights integrity
      - ./models:/app/models:ro
      # Pipeline configuration mounted read-only for live tuning
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
