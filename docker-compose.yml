services:
  docneedle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docneedle
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - MODEL_STORAGE_DIR=/app/models
      - CONFIG_TOML=/app/config.toml
    volumes:
      # Model weights stored on host to persist across container rebuilds
      - ./models:/app/models
      # Pipeline configuration mounted read-only for live tuning
      - ./config.toml:/app/config.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
