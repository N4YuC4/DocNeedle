name: DocNeedle CI & Zero-Disk Enforcement

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          CMAKE_ARGS: "-DGGML_CUDA=off"
        run: |
          uv pip install --system -r requirements.txt || uv pip install --system .
          uv pip install --system pytest pytest-asyncio anyio ruff

      - name: Code formatting and linting
        run: |
          ruff check .
          ruff format --check .

      - name: Run fast unit test suite (156 tests, kernel hardening & zero-disk)
        run: |
          CUDA_DIRS=$(python -c "import sys; sys.path.insert(0, 'src'); import docneedle.cuda_compat as c; print(':'.join(str(p) for p in c.configure_cuda_library_paths()))")
          export LD_LIBRARY_PATH="${CUDA_DIRS}:${LD_LIBRARY_PATH}"
          pytest tests/test_clean_modules.py tests/test_collision.py tests/test_collision_turkish.py tests/test_acroform.py tests/test_ui_schema_sync.py tests/test_health.py tests/test_speculative.py tests/test_cuda_compat.py tests/test_ingest.py tests/test_ocr_grounding.py tests/test_zero_disk.py -v

  container-zero-disk-enforcement:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build test stage image
        run: |
          docker build --target test -t docneedle:test .

      - name: Enforce zero-disk document parsing under kernel read-only rootfs
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=1024m \
            --ulimit core=0 \
            docneedle:test

  container-service-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare mock model directories
        run: |
          mkdir -p models/embedding models/llm models/reranker
          touch models/embedding/dummy.gguf

      - name: Build and launch hardened headless container
        run: |
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify kernel non-dumpable log in container
        run: |
          for i in {1..30}; do
            if docker logs docneedle-api 2>&1 | grep "PR_SET_DUMPABLE=0"; then
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Timed out waiting for PR_SET_DUMPABLE=0 log in container"
          docker logs docneedle-api
          exit 1

      - name: Verify health endpoint under read-only rootfs
        run: |
          curl --retry 5 --retry-delay 3 --retry-all-errors -f http://localhost:8000/healthz

      - name: Verify unsupported format fail-fast (HTTP 415) under read-only rootfs
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/v1/extract \
            -F "files=@Dockerfile" \
            -F 'schema=[{"key":"title","description":"test"}]')
          echo "HTTP Status for unsupported upload: $status"
          [ "$status" -eq 415 ]

      - name: Tear down container
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down
