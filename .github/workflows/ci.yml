name: DocNeedle CI & Zero-Disk Enforcement

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
      CMAKE_ARGS: "-DGGML_CUDA=off"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create isolated virtualenv
        run: uv venv --python 3.14

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio anyio ruff
          uv pip install --no-deps -e .

      - name: Use CPU-only llama-cpp-python for CI
        run: |
          uv pip uninstall llama-cpp-python
          uv pip install "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36/llama_cpp_python-0.3.36-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl"

      - name: Code formatting and linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run fast unit test suite (159 tests, kernel hardening & zero-disk)
        run: |
          CUDA_DIRS=$(uv run python -c "import docneedle.cuda_compat as c; print(':'.join(map(str, c.configure_cuda_library_paths())))")
          export LD_LIBRARY_PATH="${CUDA_DIRS}:${LD_LIBRARY_PATH}"
          # Runs all unit & zero-disk tests, excluding heavy model-weight tests that require live GGUFs
          uv run pytest tests/ \
            --ignore=tests/test_extraction.py \
            --ignore=tests/test_multimodal_extraction.py \
            --ignore=tests/test_retrieval.py \
            --ignore=tests/test_jobs.py \
            -v

  container-zero-disk-enforcement:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build test stage image
        run: |
          docker build --build-arg INSTALL_CPU_LLAMA=true --target test -t docneedle:test .

      - name: Enforce zero-disk document parsing under kernel read-only rootfs
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=1024m \
            --ulimit core=0 \
            docneedle:test

  container-service-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare mock model directories
        run: |
          mkdir -p models/embedding models/llm models/reranker
          touch models/embedding/dummy.gguf

      - name: Build and launch hardened container (CPU profile)
        env:
          INSTALL_CPU_LLAMA: "true"
        run: |
          docker compose --profile cpu build --build-arg INSTALL_CPU_LLAMA=true
          if ! docker compose --profile cpu up -d --wait; then
            echo "ERROR: Container failed healthcheck during startup. Container logs:"
            docker logs docneedle || true
            exit 1
          fi

      - name: Verify kernel non-dumpable log in container
        run: |
          for i in {1..30}; do
            if docker logs docneedle 2>&1 | grep "PR_SET_DUMPABLE=0"; then
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Timed out waiting for PR_SET_DUMPABLE=0 log in container"
          docker logs docneedle
          exit 1

      - name: Verify health endpoint under read-only rootfs
        run: |
          curl --retry 5 --retry-delay 3 --retry-all-errors -f http://localhost:7860/healthz

      - name: Verify unsupported format fail-fast (HTTP 415) under read-only rootfs
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:7860/v1/extract \
            -F "files=@Dockerfile" \
            -F 'schema=[{"key":"title","description":"test"}]')
          echo "HTTP Status for unsupported upload: $status"
          [ "$status" -eq 415 ]

      - name: Tear down container
        if: always()
        run: |
          docker compose --profile cpu down
